<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貯金とお金の明細</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: linear-gradient(180deg, #fff1f8, #eef5ff);
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px 16px 100px;
}

header {
  padding: 15px 5px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #777;
}

.anime-card {
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  padding: 24px;
  margin-bottom: 18px;
  background: linear-gradient(135deg, #ff7eb3, #8ec5fc);
  color: white;
  box-shadow: 0 12px 30px rgba(100,100,150,.18);
}

.anime-card::after {
  content: "★";
  position: absolute;
  right: 20px;
  top: 5px;
  font-size: 90px;
  opacity: .18;
}

.anime-card h2 {
  margin: 0 0 12px;
  font-size: 21px;
}

.balance {
  font-size: 34px;
  font-weight: 800;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  background: rgba(255,255,255,.9);
  border-radius: 20px;
  padding: 17px;
  box-shadow: 0 6px 18px rgba(0,0,0,.06);
}

.stat span {
  display: block;
  color: #777;
  font-size: 13px;
  margin-bottom: 7px;
}

.stat strong {
  font-size: 19px;
}

section {
  background: rgba(255,255,255,.92);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 6px 20px rgba(0,0,0,.06);
}

section h2 {
  margin-top: 0;
  font-size: 20px;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 6px 0 10px;
  border: 1px solid #ddd;
  border-radius: 14px;
  font-size: 16px;
  background: white;
}

button {
  border: 0;
  border-radius: 15px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #ff6fae;
  color: white;
}

.goal {
  padding: 15px;
  border-radius: 17px;
  background: #f5f7ff;
  margin-top: 10px;
}

.progress {
  height: 10px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}

.progress div {
  height: 100%;
  background: linear-gradient(90deg,#ff6fae,#7cb8ff);
}

.transaction {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.transaction:last-child {
  border-bottom: 0;
}

.income {
  color: #1c9b60;
}

.expense {
  color: #e84c73;
}

.delete {
  background: #f1f1f1;
  padding: 8px 11px;
  font-size: 13px;
}

.empty {
  color: #999;
  text-align: center;
  padding: 15px 0;
}

footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>貯金とお金の明細</h1>
  <p>毎日のお金をかんたんに管理しよう ✨</p>
</header>

<div class="anime-card">
  <h2>現在の残高</h2>
  <div class="balance" id="balance">¥0</div>
  <p>あなたのお金の記録</p>
</div>

<div class="stats">
  <div class="stat">
    <span>収入</span>
    <strong id="income">¥0</strong>
  </div>

  <div class="stat">
    <span>支出</span>
    <strong id="expense">¥0</strong>
  </div>

  <div class="stat">
    <span>貯金</span>
    <strong id="saving">¥0</strong>
  </div>

  <div class="stat">
    <span>取引件数</span>
    <strong id="count">0</strong>
  </div>
</div>

<section>
  <h2>💰 お金を記録</h2>

  <input id="title" type="text" placeholder="内容を入力">

  <input id="amount" type="number" placeholder="金額（円）">

  <select id="type">
    <option value="income">収入</option>
    <option value="expense">支出</option>
    <option value="saving">貯金</option>
  </select>

  <button class="primary" onclick="addTransaction()">
    記録する
  </button>
</section>

<section>
  <h2>🎯 貯金の目標</h2>

  <input id="goalName" type="text" placeholder="目標の名前">

  <input id="goalAmount" type="number" placeholder="目標金額（円）">

  <button class="primary" onclick="addGoal()">
    目標を追加
  </button>

  <div id="goals"></div>
</section>

<section>
  <h2>📋 お金の明細</h2>
  <div id="transactions"></div>
</section>

<footer>
  貯金とお金の明細
</footer>

</div>

<script>

let transactions =
  JSON.parse(localStorage.getItem("transactions") || "[]");

let goals =
  JSON.parse(localStorage.getItem("goals") || "[]");


function yen(number) {
  return "¥" + Number(number).toLocaleString("ja-JP");
}


function saveData() {
  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );

  localStorage.setItem(
    "goals",
    JSON.stringify(goals)
  );
}


function addTransaction() {

  const title =
    document.getElementById("title").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  const type =
    document.getElementById("type").value;

  if (!title || !amount || amount <= 0) {
    alert("内容と金額を入力してください。");
    return;
  }

  transactions.unshift({
    id: Date.now(),
    title: title,
    amount: amount,
    type: type,
    date: new Date().toLocaleDateString("ja-JP")
  });

  document.getElementById("title").value = "";
  document.getElementById("amount").value = "";

  saveData();
  render();
}


function deleteTransaction(id) {

  transactions =
    transactions.filter(item => item.id !== id);

  saveData();
  render();
}


function addGoal() {

  const name =
    document.getElementById("goalName").value.trim();

  const amount =
    Number(document.getElementById("goalAmount").value);

  if (!name || !amount || amount <= 0) {
    alert("目標と金額を入力してください。");
    return;
  }

  goals.push({
    id: Date.now(),
    name: name,
    amount: amount
  });

  document.getElementById("goalName").value = "";
  document.getElementById("goalAmount").value = "";

  saveData();
  render();
}


function deleteGoal(id) {

  goals =
    goals.filter(goal => goal.id !== id);

  saveData();
  render();
}


function render() {

  let income = 0;
  let expense = 0;
  let saving = 0;

  transactions.forEach(item => {

    if (item.type === "income") {
      income += item.amount;
    }

    if (item.type === "expense") {
      expense += item.amount;
    }

    if (item.type === "saving") {
      saving += item.amount;
    }

  });

  const balance =
    income - expense - saving;

  document.getElementById("balance").textContent =
    yen(balance);

  document.getElementById("income").textContent =
    yen(income);

  document.getElementById("expense").textContent =
    yen(expense);

  document.getElementById("saving").textContent =
    yen(saving);

  document.getElementById("count").textContent =
    transactions.length;


  const list =
    document.getElementById("transactions");

  if (transactions.length === 0) {

    list.innerHTML =
      '<div class="empty">まだ記録がありません。</div>';

  } else {

    list.innerHTML =
      transactions.map(item => {

        let label = "収入";
        let className = "income";
        let sign = "+";

        if (item.type === "expense") {
          label = "支出";
          className = "expense";
          sign = "-";
        }

        if (item.type === "saving") {
          label = "貯金";
          className = "income";
          sign = "-";
        }

        return `
          <div class="transaction">
            <div>
              <strong>${item.title}</strong><br>
              <small>${item.date} ・ ${label}</small>
            </div>

            <div>
              <strong class="${className}">
                ${sign}${yen(item.amount)}
              </strong>
              <br>
              <button class="delete"
                onclick="deleteTransaction(${item.id})">
                削除
              </button>
            </div>
          </div>
        `;

      }).join("");

  }


  const goalBox =
    document.getElementById("goals");

  if (goals.length === 0) {

    goalBox.innerHTML =
      '<div class="empty">貯金目標がありません。</div>';

  } else {

    goalBox.innerHTML =
      goals.map(goal => {

        const percentage =
          Math.min(100, Math.round((saving / goal.amount) * 100));

        return `
          <div class="goal">

            <strong>${goal.name}</strong>

            <p>
              ${yen(saving)} / ${yen(goal.amount)}
            </p>

            <div class="progress">
              <div style="width:${percentage}%"></div>
            </div>

            <small>${percentage}% 達成</small>

            <br><br>

            <button class="delete"
              onclick="deleteGoal(${goal.id})">
              削除
            </button>

          </div>
        `;

      }).join("");

  }

}


render();

</script>

</body>
</html>
